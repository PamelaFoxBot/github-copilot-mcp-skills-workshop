[project]
name = "github-copilot-mcp-skills-workshop"
version = "0.1.0"
description = "A workshop on extending GitHub Copilot with MCP servers and agent skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "prek>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["D203"]

[tool.pytest.ini_options]
pythonpath = ["."]